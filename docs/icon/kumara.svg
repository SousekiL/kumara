<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="410" y1="0" x2="640" y2="0">
      <stop offset="0" stop-color="#7FA8FF"/>
      <stop offset="1" stop-color="#4FD9EC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: an 824 pt rounded square centered on the 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#0D0D0E" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <!-- A palm-leaf manuscript (贝叶经): a long leaf with its string hole, one line of the original, one of the translation -->
  <rect x="214" y="392" width="596" height="240" rx="120" fill="none" stroke="#FFFFFF" stroke-width="32"/>
  <circle cx="352" cy="512" r="17" fill="#FFFFFF"/>
  <line x1="410" y1="472" x2="714" y2="472" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
  <line x1="410" y1="552" x2="640" y2="552" stroke="url(#accent)" stroke-width="24" stroke-linecap="round"/>
</svg>
